# Signaling
listening-port=3478
# tls-listening-port=5349
listening-ip=0.0.0.0

# Replace with your TURN box's actual public IP
external-ip=127.0.0.1
relay-ip=127.0.0.1

# Wide relay port range
min-port=49152
max-port=65535

# Auth: shared-secret
use-auth-secret
static-auth-secret=local_test_secret
realm=localhost

# TLS (Uncomment when certs are available)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# no-tlsv1
# no-tlsv1_1

# Hardening
fingerprint
stale-nonce=600
no-cli
no-multicast-peers
no-loopback-peers
